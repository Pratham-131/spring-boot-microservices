services:
  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      MONGO_URI: mongodb://mongo:27017/authdb
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-key-change-before-deploying-123456}
    depends_on:
      mongo:
        condition: service_healthy

  product-service:
    build: ./product-service
    container_name: product-service
    environment:
      MONGO_URI: mongodb://mongo:27017/productdb
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-key-change-before-deploying-123456}
    depends_on:
      mongo:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:4001
      PRODUCT_SERVICE_URL: http://product-service:4002
    depends_on:
      - auth-service
      - product-service

volumes:
  mongo-data: