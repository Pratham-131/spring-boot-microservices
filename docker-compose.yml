services:
  mongo:
    image: mongo:7
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-service:
    build: ./auth-service
    environment:
      MONGO_URI: ${AUTH_MONGO_URI:-mongodb://mongo:27017/authdb}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:4001/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  product-service:
    build: ./product-service
    environment:
      MONGO_URI: ${PRODUCT_MONGO_URI:-mongodb://mongo:27017/productdb}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:4002/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  api-gateway:
    build: ./api-gateway
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:4001
      PRODUCT_SERVICE_URL: http://product-service:4002
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

volumes:
  mongo-data: